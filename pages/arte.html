<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Galería de Arte | Estudio Creativo</title>
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/arte-libro.css" />
  <link rel="stylesheet" href="../css/arte-movil.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />

  <script type="module">
    import { protegerRuta } from '../js/proteger.js';
    document.documentElement.style.visibility = "hidden";
    protegerRuta().then((datos) => {
      if (datos) {
        document.documentElement.style.visibility = "visible";
        document.body.classList.add("cargado");
      }
    });
  </script>

  <style>
    .estudio-canvas-wrapper {
      touch-action: none; -webkit-user-select: none; user-select: none;
      display: flex; justify-content: center; align-items: center;
      background: #e5e5e5; width: 100%; overflow: hidden;
      flex: 1; position: relative;
    }
    .canvas-stack {
      position: relative; max-width: 100%; max-height: 100%;
      aspect-ratio: 3 / 2; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: 0 auto;
    }
    .canvas-stack canvas {
      position: absolute; top: 0; left: 0;
      width: 100% !important; height: 100% !important; touch-action: none;
    }
    .btn-menu-movil-flotante, #overlayMenu, .barra-instagram, .btn-cerrar-toolbar { display: none; }
    .btn-museo.editar { background: #3b82f6; color: white; border: 1px solid #3b82f6; }
    .btn-museo.copiar { background: #10b981; color: white; border: 1px solid #10b981; }

    /* Estilos Escritorio */
    .estudio-topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #111; color: #fff; border-bottom: 1px solid #333; }
    .estudio-toolbar { display: flex; flex-direction: row; flex-wrap: wrap; gap: 20px; padding: 10px 20px; background: #1a1a1a; color: #fff; align-items: center; justify-content: center; }
    .estudio-footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #111; border-top: 1px solid #333; color: #fff; }
    .tool-group { display: flex; flex-direction: row; align-items: center; gap: 10px; }
    .tool-label { font-size: 0.8rem; font-weight: bold; color: #c9a050; text-transform: uppercase; }
    .tool-btn { padding: 8px 12px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; cursor: pointer; transition: 0.2s; }
    .tool-btn:hover { background: #333; }
    .tool-btn.active { background: #c9a050; color: #000; border-color: #c9a050; }
    .grosor-control { display: flex; align-items: center; gap: 10px; }
    .grosor-badge { background: #333; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
    .colores-grid { display: flex; gap: 8px; }
    .color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; background: var(--c); }
    .color-btn.active { border-color: #fff; transform: scale(1.1); }
    .fondo-controles { display: flex; gap: 10px; align-items: center; }
    .fondo-color-input { width: 30px; height: 30px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-footer-icon { background: #222; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
    .btn-footer-icon.borrar { color: #ff6b6b; border-color: #ff6b6b; }
    .footer-right { display: flex; gap: 10px; }
    .btn-accion { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
    .btn-accion.secundario { background: #333; color: #fff; }
    .btn-accion.primario { background: #c9a050; color: #000; }
    .panel-temas-drawer { z-index: 10000 !important; }
    .panel-temas-overlay { z-index: 9999 !important; }
  </style>
</head>
<body class="page-inner album-body" data-cancion-titulo="Nuestra Canción" data-cancion-artista="Para ti" data-tema="minimalista">

  <nav class="nav-back album-nav">
    <a href="../index.html">Volver al Inicio</a>
  </nav>

  <header class="album-header">
    <div class="header-content">
      <h1>Nuestra Galería</h1>
      <div class="header-acciones">
        <button type="button" class="btn-crear-obra" id="btnNuevaObra">Crear Nueva Obra</button>
      </div>
    </div>
  </header>

  <main class="libro-escenario">
    <div class="libro-wrapper" id="libroWrapper">
      <div class="libro" id="libro">
        <div class="libro-portada" id="libroPortada">
          <div class="portada-frente"><h2 class="portada-titulo">Mis Artes</h2></div>
        </div>
        <div class="libro-paginas" id="libroPaginas"></div>
      </div>
    </div>
  </main>

  <div class="museo-overlay" id="museoOverlay">
    <div class="museo-sala">
      <button type="button" class="museo-cerrar" id="btnCerrarMuseo">X</button>
      <div class="museo-cuadro-marco"><img id="museoImagen" src="" alt="Obra" class="museo-obra-img" /></div>
      <div class="museo-placa">
        <h3 id="museoTitulo">Título</h3>
        <div class="museo-acciones">
          <button class="btn-museo copiar" id="btnCopiarObraMuseo">Copiar Todo</button>
          <button class="btn-museo editar" id="btnEditarObra">Editar Obra</button>
          <button class="btn-museo borrar" id="btnBorrarObra">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       ESTUDIO (AQUI SE DIVIDE ESCRITORIO Y MOVIL)
       ========================================== -->
  <div class="estudio-overlay" id="estudioOverlay">
    <div class="estudio" id="estudio">
      
      <!-- VISTA ESCRITORIO -->
      <div class="vista-escritorio" style="display: flex; flex-direction: column; width: 100%; height: 100%;">
        <div class="estudio-topbar">
          <div class="estudio-titulo-app">🎨 Estudio Creativo</div>
          <input type="text" id="tituloObra" placeholder="Título..." style="background: transparent; border: none; color: #fff; text-align: center;" />
          <button type="button" class="estudio-cerrar" id="cerrarEstudio">X</button>
        </div>

        <div class="estudio-toolbar">
          <div class="tool-group herramientas">
            <span class="tool-label">Herramientas</span>
            <button type="button" class="tool-btn active" data-tool="pincel">Pincel</button>
            <button type="button" class="tool-btn" data-tool="lapiz">Lápiz</button>
            <button type="button" class="tool-btn" data-tool="neon">Neón</button>
            <button type="button" class="tool-btn" data-tool="spray">Espray</button>
            <button type="button" class="tool-btn" data-tool="borrador">Borrador</button>
          </div>
          <div class="tool-group grosor">
            <span class="tool-label">Grosor</span>
            <input type="range" class="input-grosor" min="1" max="50" value="8" />
            <span class="grosor-badge">8</span>
          </div>
          <div class="tool-group colores">
            <span class="tool-label">Paleta</span>
            <div class="colores-grid">
              <button type="button" class="color-btn active" data-color="#1a1a1a" style="--c:#1a1a1a"></button>
              <button type="button" class="color-btn" data-color="#e63946" style="--c:#e63946"></button>
              <button type="button" class="color-btn" data-color="#f4a261" style="--c:#f4a261"></button>
              <button type="button" class="color-btn" data-color="#2a9d8f" style="--c:#2a9d8f"></button>
              <button type="button" class="color-btn" data-color="#457b9d" style="--c:#457b9d"></button>
              <button type="button" class="color-btn" data-color="#9d4edd" style="--c:#9d4edd"></button>
            </div>
          </div>
          <div class="tool-group">
            <span class="tool-label">Portapapeles</span>
            <button type="button" class="tool-btn btn-copiar">Copiar Trazos</button>
            <button type="button" class="tool-btn btn-pegar">Pegar Trazos</button>
          </div>
        </div>

        <div class="estudio-canvas-wrapper">
          <div class="canvas-stack"><canvas class="lienzo-fondo" width="900" height="600"></canvas><canvas class="lienzo-dibujo" width="900" height="600"></canvas></div>
        </div>

        <div class="estudio-footer">
          <div class="footer-left">
            <span class="footer-label">Fondo:</span>
            <input type="color" class="fondo-color-input" value="#ffffff" />
            <button type="button" class="btn-footer-icon btn-subir-fondo">Subir</button>
            <button type="button" class="btn-footer-icon borrar btn-quitar-fondo">Quitar</button>
          </div>
          <div class="footer-right">
            <button type="button" class="btn-accion secundario btn-limpiar">Limpiar Lienzo</button>
            <button type="button" class="btn-accion primario btn-guardar">Guardar Obra</button>
          </div>
        </div>
      </div>

      <!-- VISTA MÓVIL -->
      <div class="vista-movil" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
        <button class="btn-menu-movil-flotante" id="btnAbrirMenuM">≡</button>
        <div id="overlayMenu"></div>

        <div class="estudio-toolbar" id="estudioToolbar">
          <button class="btn-cerrar-toolbar" id="btnCerrarMenuM">X</button>
          <div class="tool-group">
            <span class="tool-label">Título</span>
            <input type="text" id="tituloObraM" placeholder="Título..." />
          </div>
          <div class="tool-group">
            <span class="tool-label">Herramientas</span>
            <button type="button" class="tool-btn active" data-tool="pincel">Pincel</button>
            <button type="button" class="tool-btn" data-tool="lapiz">Lápiz</button>
            <button type="button" class="tool-btn" data-tool="neon">Neón</button>
            <button type="button" class="tool-btn" data-tool="spray">Espray</button>
            <button type="button" class="tool-btn" data-tool="borrador">Borrador</button>
          </div>
          <div class="tool-group">
            <span class="tool-label">Fondo</span>
            <input type="color" class="fondo-color-input" value="#ffffff" />
            <button type="button" class="btn-footer-icon btn-subir-fondo">Subir</button>
            <button type="button" class="btn-footer-icon borrar btn-quitar-fondo">Quitar</button>
          </div>
          <div class="tool-group">
            <button type="button" class="btn-accion secundario btn-limpiar">Limpiar Lienzo</button>
            <button type="button" class="btn-accion primario btn-guardar">Guardar Obra</button>
          </div>
        </div>

        <div class="estudio-canvas-wrapper">
          <div class="canvas-stack"><canvas class="lienzo-fondo" width="900" height="600"></canvas><canvas class="lienzo-dibujo" width="900" height="600"></canvas></div>
        </div>

        <div class="barra-instagram">
          <button class="tool-btn btn-copiar" style="font-size: 0.8rem;">Copiar</button>
          <button class="tool-btn btn-pegar" style="font-size: 0.8rem;">Pegar</button>
          <div class="paleta-rapida" style="display:flex; gap: 8px;">
             <button type="button" class="color-btn active" data-color="#1a1a1a" style="--c:#1a1a1a"></button>
             <button type="button" class="color-btn" data-color="#e63946" style="--c:#e63946"></button>
             <button type="button" class="color-btn" data-color="#f4a261" style="--c:#f4a261"></button>
             <button type="button" class="color-btn" data-color="#2a9d8f" style="--c:#2a9d8f"></button>
          </div>
          <button class="btn-accion-principal btn-guardar">Guardar</button>
        </div>
      </div>

    </div>
  </div>

  <input type="file" id="inputFondo" accept="image/*" hidden />
  <script type="module" src="../js/arte.js"></script>
</body>
</html>
