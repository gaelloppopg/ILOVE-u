  <style>
    /* ============================================
       RAZONES — EXPERIENCIA PREMIUM
       ============================================ */
    html, body.razones-page { margin: 0; padding: 0; min-height: 100vh; }
    body.razones-page { background: #faf3ff; color: #3a2145; font-family: 'Inter', sans-serif; position: relative; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    .aurora-canvas { position: fixed; inset: 0; z-index: -3; pointer-events: none; }
    .particulas-canvas { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
    body.razones-page::after { content: ""; position: fixed; inset: 0; background-image: radial-gradient(circle at 8% 22%, rgba(201, 156, 240, 0.35) 1px, transparent 1.5px), radial-gradient(circle at 78% 18%, rgba(240, 170, 200, 0.4) 1px, transparent 1.5px), radial-gradient(circle at 44% 76%, rgba(201, 156, 240, 0.3) 1px, transparent 1.5px), radial-gradient(circle at 92% 60%, rgba(240, 170, 200, 0.35) 1px, transparent 1.5px); z-index: -1; pointer-events: none; animation: titilarEstrellas 6s ease-in-out infinite alternate; }
    @keyframes titilarEstrellas { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    body.razones-page .nav-back { position: sticky; top: 0; padding: 16px 30px; background: rgba(255, 250, 255, 0.65); border-bottom: 1px solid rgba(180, 130, 240, 0.12); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); z-index: 100; }
    body.razones-page .nav-back a { color: #6a4780; font-size: 0.72rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 500; transition: color 0.3s ease; text-decoration: none; }
    body.razones-page .nav-back a:hover { color: #a874e8; }
    .razones-hero { max-width: 960px; margin: 0 auto; padding: 90px 24px 30px; text-align: center; position: relative; z-index: 2; }
    .razones-hero-badge { display: inline-flex; align-items: center; gap: 14px; font-family: 'Inter', sans-serif; font-size: 0.62rem; letter-spacing: 8px; text-transform: uppercase; color: #a874e8; font-weight: 600; margin-bottom: 26px; opacity: 0; animation: fadeInRazones 1.2s ease 0.2s forwards; }
    .razones-hero-badge::before, .razones-hero-badge::after { content: ""; width: 32px; height: 1px; background: linear-gradient(to right, transparent, #c99cf0, transparent); }
    .razones-hero h1 { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(2rem, 5.5vw, 3.6rem); font-weight: 400; line-height: 1.08; letter-spacing: -0.02em; color: #3a2145; margin-bottom: 24px; opacity: 0; animation: fadeInRazones 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .razones-hero h1 em { color: #a874e8; font-style: italic; text-shadow: 0 0 40px rgba(201, 156, 240, 0.5); position: relative; display: inline-block; }
    .razones-hero h1 em::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 1px; background: linear-gradient(to right, transparent, #c99cf0, transparent); animation: lineaHero 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; transform-origin: center; }
    @keyframes lineaHero { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    .razones-hero p { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.05rem, 1.6vw, 1.25rem); font-style: italic; font-weight: 300; color: #7a5c8c; line-height: 1.7; max-width: 560px; margin: 0 auto; opacity: 0; animation: fadeInRazones 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards; }
    @keyframes fadeInRazones { from { opacity: 0; transform: translateY(20px); filter: blur(8px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    .razones-controles { max-width: 1000px; margin: 50px auto 0; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; opacity: 0; animation: fadeInRazones 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards; }
    .razones-contador { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(180, 130, 240, 0.22); border-radius: 50px; backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); box-shadow: 0 8px 24px rgba(160, 100, 220, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9); font-family: 'Inter', sans-serif; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: #6a4780; font-weight: 600; white-space: nowrap; }

    #buscadorRazones:focus { border-color: rgba(180, 130, 240, 0.55); background: rgba(255, 255, 255, 0.95); box-shadow: 0 12px 32px rgba(160, 100, 220, 0.22), inset 0 1px 0 rgba(255, 255, 255, 1), 0 0 0 4px rgba(201, 156, 240, 0.15); }
    .razones-buscador-wrap::before { content: ""; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 1.5px solid #c99cf0; border-radius: 50%; pointer-events: none; }

    .btn-azar, .btn-nueva-razon { display: inline-flex; align-items: center; gap: 10px; padding: 12px 26px; background: linear-gradient(135deg, #c99cf0 0%, #a874e8 50%, #8a5fd0 100%); color: #fff; border: none; border-radius: 50px; font-family: inherit; font-size: 0.72rem; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 28px rgba(160, 100, 220, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3); position: relative; overflow: hidden; white-space: nowrap; }
    .btn-azar::before, .btn-nueva-razon::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%); transform: translateX(-100%); transition: transform 0.8s ease; }
    .btn-azar:hover::before, .btn-nueva-razon:hover::before { transform: translateX(100%); }
    .btn-azar:hover, .btn-nueva-razon:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 16px 38px rgba(160, 100, 220, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
    .btn-nueva-razon { background: linear-gradient(135deg, #a874e8 0%, #f28ca6 100%); }
    .btn-nueva-razon::after { content: "✨"; margin-left: 4px; }
    .razones-grid { max-width: 1320px; margin: 30px auto 0; padding: 10px 24px 120px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; position: relative; z-index: 2; }
    .petalo { position: relative; padding: 32px 28px 30px; border-radius: 4px 24px 4px 24px; background: linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(252, 244, 255, 0.95) 55%, rgba(255, 248, 252, 0.98) 100%); border: 1px solid rgba(200, 160, 240, 0.3); box-shadow: 0 14px 38px rgba(160, 100, 220, 0.12), 0 4px 12px rgba(200, 160, 240, 0.1), inset 0 1px 0 rgba(255, 255, 255, 1); cursor: pointer; transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s ease, border-color 0.3s ease; opacity: 0; transform: translateY(30px) scale(0.96); overflow: hidden; isolation: isolate; will-change: transform; }
    .petalo::before { content: ""; position: absolute; top: -30%; left: -20%; width: 120%; height: 120%; background: radial-gradient(ellipse at 30% 20%, rgba(220, 180, 255, 0.45) 0%, transparent 55%); pointer-events: none; z-index: 0; opacity: 0.6; transition: opacity 0.6s ease, transform 0.8s ease; }
    .petalo::after { content: ""; position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; border-top: 1px solid rgba(201, 156, 240, 0.5); border-right: 1px solid rgba(201, 156, 240, 0.5); border-radius: 0 8px 0 0; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1; }
    .petalo.visible { opacity: 1; transform: translateY(0) scale(1); }
    .petalo:hover { transform: translateY(-8px) scale(1.02); border-color: rgba(201, 156, 240, 0.65); box-shadow: 0 24px 60px rgba(160, 100, 220, 0.25), 0 8px 24px rgba(200, 160, 240, 0.2), inset 0 1px 0 rgba(255, 255, 255, 1); }
    .petalo:hover::before { opacity: 1; transform: scale(1.15); }
    .petalo:hover::after { top: 10px; right: 10px; width: 30px; height: 30px; border-color: rgba(201, 156, 240, 1); border-radius: 0 12px 0 0; }
    .petalo.destacado { border-color: rgba(201, 156, 240, 0.8); box-shadow: 0 24px 60px rgba(160, 100, 220, 0.35), 0 0 0 4px rgba(201, 156, 240, 0.15), inset 0 1px 0 rgba(255, 255, 255, 1); }
    .petalo-num { display: inline-flex; align-items: baseline; gap: 6px; font-family: 'Inter', sans-serif; font-size: 0.6rem; letter-spacing: 4px; text-transform: uppercase; color: #a874e8; font-weight: 600; margin-bottom: 18px; position: relative; z-index: 2; opacity: 0.85; }
    .petalo-num strong { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1rem; font-weight: 500; color: #a874e8; letter-spacing: 0; text-transform: none; }
    .petalo-texto { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 400; line-height: 1.5; color: #4a2a5a; position: relative; z-index: 2; letter-spacing: 0.003em; margin: 0; }
    .petalo-desc { font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; font-style: italic; color: #8a7aa8; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(201, 156, 240, 0.4); position: relative; z-index: 2; }
    .petalo-delete { position: absolute; top: 14px; right: 42px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(217, 102, 102, 0.15); color: #d96666; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; z-index: 5; }
    .petalo:hover .petalo-delete { opacity: 2; }
    .petalo-delete:hover { background: #d96666; color: #fff; transform: scale(1.15); }
    .razones-vacio { grid-column: 1 / -1; text-align: center; padding: 80px 30px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2rem; color: #a08bb8; line-height: 1.6; }
    .razones-vacio::before { content: "❦"; display: block; font-size: 2.4rem; color: #c99cf0; margin-bottom: 16px; opacity: 0.6; }
    .razon-modal { position: fixed; inset: 0; z-index: 9999; background: rgba(60, 30, 90, 0.55); display: flex; align-items: center; justify-content: center; padding: 30px 20px; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; backdrop-filter: blur(20px) saturate(130%); -webkit-backdrop-filter: blur(20px) saturate(130%); }
    .razon-modal.activo { opacity: 1; pointer-events: auto; }
    .razon-marco { position: relative; max-width: 620px; width: 100%; padding: 4px; background: linear-gradient(135deg, rgba(201, 156, 240, 0.9), rgba(240, 200, 230, 0.7), rgba(201, 156, 240, 0.9)); border-radius: 40px; transform: scale(0.85) rotateX(10deg); opacity: 0; transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease; box-shadow: 0 40px 120px rgba(120, 60, 180, 0.4), 0 0 100px rgba(200, 160, 240, 0.5); z-index: 2; }
    .razon-modal.activo .razon-marco { transform: scale(1) rotateX(0); opacity: 1; }
    .razon-petalo-grande { position: relative; padding: 60px 50px 55px; background: linear-gradient(150deg, rgba(255, 253, 255, 1) 0%, rgba(252, 244, 255, 0.98) 55%, rgba(255, 248, 252, 1) 100%); border-radius: 36px; text-align: center; overflow: hidden; }
    .razon-petalo-grande::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 18% 12%, rgba(220, 180, 255, 0.4), transparent 45%), radial-gradient(circle at 88% 88%, rgba(255, 200, 230, 0.35), transparent 45%); pointer-events: none; }
    .razon-petalo-grande::after { content: "❦"; position: absolute; top: 26px; left: 50%; transform: translateX(-50%); color: #c99cf0; font-size: 1.4rem; opacity: 0.8; text-shadow: 0 0 25px rgba(201, 156, 240, 0.6); }
    .razon-modal-num { display: inline-block; font-family: 'Inter', sans-serif; font-size: 0.7rem; letter-spacing: 8px; text-transform: uppercase; color: #a874e8; font-weight: 600; margin-bottom: 25px; margin-top: 25px; position: relative; z-index: 2; padding: 8px 20px; border: 1px solid rgba(201, 156, 240, 0.4); border-radius: 50px; background: rgba(201, 156, 240, 0.08); }
    .razon-modal-texto { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1.4rem, 3.8vw, 2rem); font-weight: 400; line-height: 1.35; color: #3a2145; position: relative; z-index: 2; letter-spacing: -0.012em; }
    .razon-modal-texto::first-letter { color: #a874e8; font-size: 1.15em; }
    .razon-modal-desc { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.05rem; color: #7a5c8c; margin-top: 22px; padding-top: 20px; border-top: 1px dashed rgba(201, 156, 240, 0.5); position: relative; z-index: 2; }
    .razon-modal-cerrar { position: absolute; top: 22px; right: 22px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(180, 130, 240, 0.4); background: rgba(255, 255, 255, 0.95); color: #a874e8; font-size: 1.15rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); z-index: 5; box-shadow: 0 8px 22px rgba(180, 130, 240, 0.25); }
    .razon-modal-cerrar:hover { background: #a874e8; color: #fff; transform: rotate(90deg) scale(1.08); }
    .nueva-modal { position: fixed; inset: 0; z-index: 9999; background: rgba(60, 30, 90, 0.55); display: flex; align-items: center; justify-content: center; padding: 30px 20px; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

    .nueva-num-auto { text-align: center; font-family: 'Inter', sans-serif; font-size: 0.65rem; letter-spacing: 5px; text-transform: uppercase; color: #a874e8; font-weight: 700; margin-bottom: 28px; }
    .nueva-campo { margin-bottom: 18px; }
    .nueva-label { display: block; font-family: 'Inter', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8a7aa8; margin-bottom: 8px; }

    body.razones-page .footer { border-top: 1px solid rgba(180, 130, 240, 0.15); color: #7a5c8c; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; padding: 50px 20px; text-align: center; position: relative; z-index: 2; }

<body class="page-inner razones-page" data-cancion-titulo="Nuestra Canción" data-cancion-artista="Para ti 💕">

        <p class="nueva-num-auto" id="nuevaNumAuto">Se guardará como RAZÓN 001</p>
        <div class="nueva-campo"><label class="nueva-label">La razón</label><textarea id="nuevaTextoInput" class="nueva-textarea" placeholder="Escribí la razón..." maxlength="300"></textarea></div>
        <div class="nueva-campo"><label class="nueva-label">Descripción (opcional)</label><textarea id="nuevaDescInput" class="nueva-textarea" placeholder="Algo más para agregar..." maxlength="300" style="min-height: 70px;"></textarea></div>
        <div class="nueva-acciones"><button class="nueva-btn primario" id="btnGuardarNueva">Guardar</button><button class="nueva-btn neutro" id="btnCancelarNueva">Cancelar</button></div>
      </div>
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL DE RAZONES (Ahora usando Supabase) -->
  <script type="module">
    import { protegerRuta } from '../js/proteger.js';
    import { supabase } from '../js/supabase.js';
    import { iniciarRealtimeGlobal } from '../js/realtime.js';

    let coupleId = null;
    let razones = [];
    let filtroTexto = "";

    function numeroRazon(n) { return String(n).padStart(3, "0"); }

    // 1. Cargar razones desde Supabase
    async function cargarRazonesSupabase() {
      if (!coupleId) return;
      const { data, error } = await supabase
        .from('razones')
        .select('*')
        .eq('couple_id', coupleId)
        .order('numero', { ascending: true });

      if (error) {
        console.error("Error cargando razones:", error);
        return;
      }
      razones = data || [];
      renderRazones(filtroTexto);
    }

    // 2. Guardar una nueva razón en Supabase
    async function guardarRazonSupabase(texto, descripcion) {
      const { data: maxData } = await supabase
        .from('razones')
        .select('numero')
        .eq('couple_id', coupleId)
        .order('numero', { ascending: false })
        .limit(1);
      
      const nuevoNumero = (maxData && maxData.length > 0) ? maxData[0].numero + 1 : 1;

      const { error } = await supabase.from('razones').insert([{
        couple_id: coupleId,
        texto: texto,
        descripcion: descripcion || null,
        numero: nuevoNumero
      }]);

      if (error) throw error;
      await cargarRazonesSupabase();
    }

    // 3. Eliminar una razón de Supabase
    async function eliminarRazonSupabase(id) {
      const { error } = await supabase.from('razones').delete().eq('id', id);
      if (error) throw error;
      await cargarRazonesSupabase();
    }

    // 4. Renderizar las tarjetas en pantalla
    function renderRazones(filtro = "") {
      const grid = document.getElementById("razonesGrid");
      const contadorEl = document.getElementById("contadorRazones");
      if (!grid) return;

      const filtroLower = filtro.trim().toLowerCase();
      const lista = filtroLower 
        ? razones.filter(r => (r.texto || "").toLowerCase().includes(filtroLower) || (r.descripcion || "").toLowerCase().includes(filtroLower)) 
        : razones;

      contadorEl.textContent = razones.length;

      if (lista.length === 0) {
        grid.innerHTML = `<div class="razones-vacio">No encontré esa razón... pero estoy seguro de que existe.</div>`;
        return;
      }

      grid.innerHTML = lista.map((r, i) => `
        <article class="petalo" data-id="${r.id}" data-numero="${r.numero}" style="transition-delay: ${Math.min(i * 40, 600)}ms">
          <button class="petalo-delete" onclick="event.stopPropagation(); window.eliminarRazon('${r.id}')" title="Eliminar">🗑️</button>
          <span class="petalo-num">Razón <strong>${numeroRazon(r.numero)}</strong></span>
          <p class="petalo-texto">${r.texto}</p>
          ${r.descripcion ? `<p class="petalo-desc">${r.descripcion}</p>` : ""}
        </article>
      `).join("");

      grid.querySelectorAll(".petalo").forEach(p => {
        p.addEventListener("click", () => {
          const id = p.dataset.id;
          const razon = razones.find(x => x.id === id);
          if (razon) abrirRazon(razon, p);
        });
        p.addEventListener("mousemove", (e) => {
          const rect = p.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          p.style.transform = `translateY(-8px) scale(1.02) rotateX(${-y * 6}deg) rotateY(${x * 6}deg)`;
        });
        p.addEventListener("mouseleave", () => { p.style.transform = ""; });
      });
    }

    // 5. Funciones de UI (Modales)
    const modal = document.getElementById("razonModal");
    const modalCerrar = document.getElementById("razonModalCerrar");
    function abrirRazon(razon, elemento) {
      if (elemento && window.lanzarConfeti) window.lanzarConfeti(600);
      document.getElementById("razonModalNum").textContent = `Razón ${numeroRazon(razon.numero)}`;
      document.getElementById("razonModalTexto").textContent = razon.texto;
      const descEl = document.getElementById("razonModalDesc");
      if (razon.descripcion) { descEl.textContent = razon.descripcion; descEl.style.display = "block"; } 
      else { descEl.style.display = "none"; }
      modal.classList.add("activo");
      document.body.style.overflow = "hidden";
    }
    modalCerrar.addEventListener("click", () => { modal.classList.remove("activo"); document.body.style.overflow = ""; });
    modal.addEventListener("click", (e) => { if (e.target === modal) { modal.classList.remove("activo"); document.body.style.overflow = ""; }});

    const nuevaModal = document.getElementById("nuevaModal");
    const btnNueva = document.getElementById("btnNuevaRazon");
    const nuevaModalCerrar = document.getElementById("nuevaModalCerrar");
    const btnCancelarNueva = document.getElementById("btnCancelarNueva");
    const btnGuardarNueva = document.getElementById("btnGuardarNueva");

    btnNueva.addEventListener("click", () => {
      const siguiente = razones.length + 1;
      document.getElementById("nuevaNumAuto").textContent = `Se guardará como RAZÓN ${numeroRazon(siguiente)}`;
      document.getElementById("nuevaTextoInput").value = "";
      document.getElementById("nuevaDescInput").value = "";
      nuevaModal.classList.add("activo");
      document.body.style.overflow = "hidden";
      setTimeout(() => document.getElementById("nuevaTextoInput").focus(), 400);
    });
    nuevaModalCerrar.addEventListener("click", () => { nuevaModal.classList.remove("activo"); document.body.style.overflow = ""; });
    btnCancelarNueva.addEventListener("click", () => { nuevaModal.classList.remove("activo"); document.body.style.overflow = ""; });
    nuevaModal.addEventListener("click", (e) => { if (e.target === nuevaModal) { nuevaModal.classList.remove("activo"); document.body.style.overflow = ""; }});

    btnGuardarNueva.addEventListener("click", async () => {
      const texto = document.getElementById("nuevaTextoInput").value.trim();
      const descripcion = document.getElementById("nuevaDescInput").value.trim();
      if (!texto) { alert("Escribí la razón 💜"); return; }

      btnGuardarNueva.disabled = true;
      btnGuardarNueva.textContent = "Guardando...";

      try {
        await guardarRazonSupabase(texto, descripcion);
        if (window.lanzarConfeti) window.lanzarConfeti(1500);
        nuevaModal.classList.remove("activo");
        document.body.style.overflow = "";
      } catch (err) {
        alert("❌ Error: " + err.message);
      } finally {
        btnGuardarNueva.disabled = false;
        btnGuardarNueva.textContent = "Guardar";
      }
    });

    window.eliminarRazon = async function(id) {
      if (!confirm("¿Eliminar esta razón? No se puede recuperar 💜")) return;
      try {
        await eliminarRazonSupabase(id);
        if (window.lanzarConfeti) window.lanzarConfeti(600);
      } catch (err) {
        alert("❌ Error: " + err.message);
      }
    };

    // Buscador
    const buscador = document.getElementById("buscadorRazones");
    let debounceTimer;
    if (buscador) {
      buscador.addEventListener("input", (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { filtroTexto = e.target.value; renderRazones(filtroTexto); }, 120);
      });
    }

    // Botón al azar
    const btnAzar = document.getElementById("btnAzar");
    if (btnAzar) {
      btnAzar.addEventListener("click", () => {
        if (razones.length === 0) return;
        const ganadora = razones[Math.floor(Math.random() * razones.length)];
        const card = document.querySelector(`.petalo[data-id="${ganadora.id}"]`);
        if (card) {
          card.classList.add("destacado");
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(() => {
            abrirRazon(ganadora, card);
            card.classList.remove("destacado");
          }, 600);
        }
      });
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', async () => {
      document.documentElement.style.visibility = "hidden";
      try {
        const datos = await protegerRuta();
        if (!datos || !datos.couple) return;
        coupleId = datos.couple.id;
        
        await cargarRazonesSupabase();
        
        iniciarRealtimeGlobal(coupleId);
        window.addEventListener('supabase-cambio', (e) => {
          if (e.detail.tabla === 'razones') {
            cargarRazonesSupabase();
          }
        });
      } catch (error) {
        console.error("Error init razones:", error);
      } finally {
        document.documentElement.style.visibility = "visible";
      }
    });
  </script>
</body>
</html>
